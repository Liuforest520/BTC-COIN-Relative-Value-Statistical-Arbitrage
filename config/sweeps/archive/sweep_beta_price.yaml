base_config: config/config.yaml
manifest_path: config/sweeps/archive/generated/sweep_beta_price/manifest.csv
output_dir: config/sweeps/archive/generated/sweep_beta_price
result_path: results/sweep_beta_price/sweep_results.csv
sort_by: sharpe
fast_summary: true
progress_interval_bars: 100000
workers: 4
top_backtest_count: 5
top_backtest_output_dir: results/sweep_beta_price/top_backtests
top_backtest_result_path: results/sweep_beta_price/top5.csv

common_params: &common_params
  cost.funding_enabled: [true]
  setups.multi_pair_beta.pipeline.estimator.regression_method: [price]
  setups.multi_pair_beta.pipeline.estimator.position_update_policy: [freeze]
  setups.multi_pair_beta.pipeline.signal.entry_z: [2.0, 2.5, 3.0]
  setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
  setups.multi_pair_beta.pipeline.signal.entry_rule_method: [fixed_z]
  setups.multi_pair_beta.pipeline.signal.two_stage_enabled: [false]

experiments:
  - name: tls_price_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [tls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [7200, 14400, 28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]

  - name: tls_price_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [tls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]

  - name: huber_price_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [huber]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [7200, 14400, 28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.huber_delta: [1.96]
      setups.multi_pair_beta.pipeline.estimator.huber_iterations: [5]

  - name: huber_price_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [huber]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.huber_delta: [1.96]
      setups.multi_pair_beta.pipeline.estimator.huber_iterations: [5]

  - name: ewls_price_5d_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [ewls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [7200]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.ewls_half_life_bars: [7200]

  - name: ewls_price_10d_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [ewls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [14400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.ewls_half_life_bars: [14400]

  - name: ewls_price_20d_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [ewls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.ewls_half_life_bars: [28800]

  - name: ewls_price_30d_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [ewls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [43200]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.ewls_half_life_bars: [43200]

  - name: ewls_price_60d_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [ewls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.ewls_half_life_bars: [86400]

  - name: ewls_price_20d_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [ewls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.ewls_half_life_bars: [28800]

  - name: ewls_price_30d_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [ewls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [43200]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.ewls_half_life_bars: [43200]

  - name: ewls_price_60d_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [ewls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.ewls_half_life_bars: [86400]
