base_config: config/config.yaml
manifest_path: config/sweeps/archive/generated/sweep_return_beta/manifest.csv
output_dir: config/sweeps/archive/generated/sweep_return_beta
result_path: results/sweep_return_beta/sweep_results.csv
sort_by: sharpe
fast_summary: true
progress_interval_bars: 100000
workers: 4
top_backtest_count: 5
top_backtest_output_dir: results/sweep_return_beta/top_backtests
top_backtest_result_path: results/sweep_return_beta/top5.csv

# Settings shared with the original five-model comparison. The new estimators
# differ only by using log returns and their estimator-specific parameters.
common_params: &common_params
  cost.funding_enabled: [true]
  setups.multi_pair_beta.pipeline.estimator.regression_method: [log_return]
  setups.multi_pair_beta.pipeline.estimator.position_update_policy: [freeze]
  setups.multi_pair_beta.pipeline.signal.entry_z: [2.0, 2.5, 3.0]
  setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
  setups.multi_pair_beta.pipeline.signal.entry_rule_method: [fixed_z]
  setups.multi_pair_beta.pipeline.signal.two_stage_enabled: [false]

experiments:
  # Winsorized OLS: 8 lookback/update combinations x 3 paired tail schemes
  # x 3 entry thresholds = 72 configs.
  - name: return_beta_winsor_a_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [winsorized_ols]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [7200, 14400, 28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.winsor_lower_quantile: [0.001]
      setups.multi_pair_beta.pipeline.estimator.winsor_upper_quantile: [0.999]
      setups.multi_pair_beta.pipeline.estimator.winsor_quantile_method: [linear]

  - name: return_beta_winsor_a_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [winsorized_ols]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.winsor_lower_quantile: [0.001]
      setups.multi_pair_beta.pipeline.estimator.winsor_upper_quantile: [0.999]
      setups.multi_pair_beta.pipeline.estimator.winsor_quantile_method: [linear]

  - name: return_beta_winsor_b_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [winsorized_ols]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [7200, 14400, 28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.winsor_lower_quantile: [0.005]
      setups.multi_pair_beta.pipeline.estimator.winsor_upper_quantile: [0.995]
      setups.multi_pair_beta.pipeline.estimator.winsor_quantile_method: [linear]

  - name: return_beta_winsor_b_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [winsorized_ols]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.winsor_lower_quantile: [0.005]
      setups.multi_pair_beta.pipeline.estimator.winsor_upper_quantile: [0.995]
      setups.multi_pair_beta.pipeline.estimator.winsor_quantile_method: [linear]

  - name: return_beta_winsor_c_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [winsorized_ols]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [7200, 14400, 28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.winsor_lower_quantile: [0.01]
      setups.multi_pair_beta.pipeline.estimator.winsor_upper_quantile: [0.99]
      setups.multi_pair_beta.pipeline.estimator.winsor_quantile_method: [linear]

  - name: return_beta_winsor_c_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [winsorized_ols]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.winsor_lower_quantile: [0.01]
      setups.multi_pair_beta.pipeline.estimator.winsor_upper_quantile: [0.99]
      setups.multi_pair_beta.pipeline.estimator.winsor_quantile_method: [linear]

  # Residual-weighted WLS: fixed 7D short model; 20D/30D/60D long model;
  # 1D/3D updates; 3 weight profiles; 3 entry thresholds = 54 configs.
  - name: return_beta_residual_weighted_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [residual_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.short_model_lookback_bars: [10080]
      setups.multi_pair_beta.pipeline.estimator.shock_score_boundaries: [[1.5, 2.0, 3.0]]
      setups.multi_pair_beta.pipeline.estimator.residual_wls_profile: [mild, medium, strong]

  - name: return_beta_residual_weighted_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [residual_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.short_model_lookback_bars: [10080]
      setups.multi_pair_beta.pipeline.estimator.shock_score_boundaries: [[1.5, 2.0, 3.0]]
      setups.multi_pair_beta.pipeline.estimator.residual_wls_profile: [mild, medium, strong]

  # Age-weighted WLS: bucket endpoints are paired with each lookback and must
  # not be crossed with the endpoints of another lookback. 72 configs total.
  - name: return_beta_age_weighted_5d_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [age_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [7200]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.age_bucket_end_bars: [[180, 1440, 2880, 7200]]
      setups.multi_pair_beta.pipeline.estimator.age_wls_profile: [mild, medium, strong]

  - name: return_beta_age_weighted_10d_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [age_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [14400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.age_bucket_end_bars: [[360, 1440, 5760, 14400]]
      setups.multi_pair_beta.pipeline.estimator.age_wls_profile: [mild, medium, strong]

  - name: return_beta_age_weighted_20d_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [age_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.age_bucket_end_bars: [[720, 4320, 11520, 28800]]
      setups.multi_pair_beta.pipeline.estimator.age_wls_profile: [mild, medium, strong]

  - name: return_beta_age_weighted_30d_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [age_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [43200]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.age_bucket_end_bars: [[720, 5760, 17280, 43200]]
      setups.multi_pair_beta.pipeline.estimator.age_wls_profile: [mild, medium, strong]

  - name: return_beta_age_weighted_60d_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [age_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.age_bucket_end_bars: [[1440, 10080, 36000, 86400]]
      setups.multi_pair_beta.pipeline.estimator.age_wls_profile: [mild, medium, strong]

  - name: return_beta_age_weighted_20d_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [age_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.age_bucket_end_bars: [[720, 4320, 11520, 28800]]
      setups.multi_pair_beta.pipeline.estimator.age_wls_profile: [mild, medium, strong]

  - name: return_beta_age_weighted_30d_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [age_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [43200]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.age_bucket_end_bars: [[720, 5760, 17280, 43200]]
      setups.multi_pair_beta.pipeline.estimator.age_wls_profile: [mild, medium, strong]

  - name: return_beta_age_weighted_60d_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [age_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.age_bucket_end_bars: [[1440, 10080, 36000, 86400]]
      setups.multi_pair_beta.pipeline.estimator.age_wls_profile: [mild, medium, strong]
