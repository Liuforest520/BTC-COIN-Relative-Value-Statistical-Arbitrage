base_config: config/config.yaml
manifest_path: config/sweeps/archive/generated/sweep_beta_review_best/manifest.csv
output_dir: config/sweeps/archive/generated/sweep_beta_review_best
result_path: results/sweep_beta_review_best/sweep_results.csv
sort_by: sharpe
fast_summary: true
progress_interval_bars: 100000
workers: 4
# There are 11 configs in this batch, so all of them receive a full report.
top_backtest_count: 11
top_backtest_output_dir: results/sweep_beta_review_best/backtests
top_backtest_result_path: results/sweep_beta_review_best/all_backtests.csv

common_params: &common_params
  cost.funding_enabled: [true]
  setups.multi_pair_beta.pipeline.estimator.position_update_policy: [freeze]
  setups.multi_pair_beta.pipeline.signal.entry_rule_method: [fixed_z]
  setups.multi_pair_beta.pipeline.signal.two_stage_enabled: [false]

experiments:
  - name: best_rolling_ols_log_price
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [rolling_ols]
      setups.multi_pair_beta.pipeline.estimator.regression_method: [log_price]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.signal.entry_z: [2.0]
      setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
      setups.multi_pair_beta.pipeline.signal.position_exit_zscore_method: [standard]

  - name: best_tls_log_price
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [tls]
      setups.multi_pair_beta.pipeline.estimator.regression_method: [log_price]
      setups.multi_pair_beta.pipeline.estimator.return_interval_bars: [1]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [43200]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.signal.entry_z: [2.5]
      setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
      setups.multi_pair_beta.pipeline.signal.position_exit_zscore_method: [standard]

  - name: best_tls_return
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [tls]
      setups.multi_pair_beta.pipeline.estimator.regression_method: [log_return]
      setups.multi_pair_beta.pipeline.estimator.return_interval_bars: [1]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [43200]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.signal.entry_z: [2.0]
      setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
      setups.multi_pair_beta.pipeline.signal.position_exit_zscore_method: [sum_zscore]

  - name: best_dols_log_price
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [dols]
      setups.multi_pair_beta.pipeline.estimator.regression_method: [log_price]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.dols_lead_lag_order: [1]
      setups.multi_pair_beta.pipeline.signal.entry_z: [2.0]
      setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
      setups.multi_pair_beta.pipeline.signal.position_exit_zscore_method: [standard]

  - name: best_ewls_log_price
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [ewls]
      setups.multi_pair_beta.pipeline.estimator.regression_method: [log_price]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.ewls_half_life_bars: [28800]
      setups.multi_pair_beta.pipeline.signal.entry_z: [2.0]
      setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
      setups.multi_pair_beta.pipeline.signal.position_exit_zscore_method: [standard]

  - name: best_huber_log_price
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [huber]
      setups.multi_pair_beta.pipeline.estimator.regression_method: [log_price]
      setups.multi_pair_beta.pipeline.estimator.return_interval_bars: [1]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.huber_delta: [1.96]
      setups.multi_pair_beta.pipeline.estimator.huber_iterations: [5]
      setups.multi_pair_beta.pipeline.signal.entry_z: [2.0]
      setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
      setups.multi_pair_beta.pipeline.signal.position_exit_zscore_method: [standard]

  - name: best_huber_return
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [huber]
      setups.multi_pair_beta.pipeline.estimator.regression_method: [log_return]
      setups.multi_pair_beta.pipeline.estimator.return_interval_bars: [1]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.huber_delta: [1.96]
      setups.multi_pair_beta.pipeline.estimator.huber_iterations: [5]
      setups.multi_pair_beta.pipeline.signal.entry_z: [2.5]
      setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
      setups.multi_pair_beta.pipeline.signal.position_exit_zscore_method: [sum_zscore]

  - name: best_age_weighted_log_price
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [age_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.regression_method: [log_price]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.age_bucket_end_bars: [[1440, 10080, 36000, 86400]]
      setups.multi_pair_beta.pipeline.estimator.age_wls_profile: [strong]
      setups.multi_pair_beta.pipeline.signal.entry_z: [2.0]
      setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
      setups.multi_pair_beta.pipeline.signal.position_exit_zscore_method: [standard]

  - name: best_age_weighted_return
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [age_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.regression_method: [log_return]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [43200]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.age_bucket_end_bars: [[720, 5760, 17280, 43200]]
      setups.multi_pair_beta.pipeline.estimator.age_wls_profile: [medium]
      setups.multi_pair_beta.pipeline.signal.entry_z: [2.5]
      setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
      setups.multi_pair_beta.pipeline.signal.position_exit_zscore_method: [sum_zscore]

  - name: best_fast_slow_log_price
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [residual_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.regression_method: [log_price]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [14400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.short_model_lookback_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.shock_score_boundaries: [[1.5, 2.0, 3.0]]
      setups.multi_pair_beta.pipeline.estimator.residual_wls_profile: [medium]
      setups.multi_pair_beta.pipeline.signal.entry_z: [3.0]
      setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
      setups.multi_pair_beta.pipeline.signal.position_exit_zscore_method: [standard]

  - name: best_residual_weighted_return
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [residual_weighted_wls]
      setups.multi_pair_beta.pipeline.estimator.regression_method: [log_return]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [43200]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.short_model_lookback_bars: [10080]
      setups.multi_pair_beta.pipeline.estimator.shock_score_boundaries: [[1.5, 2.0, 3.0]]
      setups.multi_pair_beta.pipeline.estimator.residual_wls_profile: [medium]
      setups.multi_pair_beta.pipeline.signal.entry_z: [2.0]
      setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
      setups.multi_pair_beta.pipeline.signal.position_exit_zscore_method: [sum_zscore]
