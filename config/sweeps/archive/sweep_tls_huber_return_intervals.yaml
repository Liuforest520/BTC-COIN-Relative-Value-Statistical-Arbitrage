base_config: config/config.yaml
manifest_path: config/sweeps/archive/generated/sweep_tls_huber_return_intervals/manifest.csv
output_dir: config/sweeps/archive/generated/sweep_tls_huber_return_intervals
result_path: results/sweep_tls_huber_return_intervals/sweep_results.csv
sort_by: sharpe
fast_summary: true
progress_interval_bars: 100000
workers: 4
top_backtest_count: 5
top_backtest_output_dir: results/sweep_tls_huber_return_intervals/top_backtests
top_backtest_result_path: results/sweep_tls_huber_return_intervals/top5.csv

common_params: &common_params
  cost.funding_enabled: [true]
  setups.multi_pair_beta.pipeline.estimator.regression_method: [log_return]
  setups.multi_pair_beta.pipeline.estimator.return_interval_bars: [1, 60, 300]
  setups.multi_pair_beta.pipeline.estimator.position_update_policy: [freeze]
  setups.multi_pair_beta.pipeline.signal.entry_z: [2.0, 2.5, 3.0]
  setups.multi_pair_beta.pipeline.signal.exit_z: [0.5]
  setups.multi_pair_beta.pipeline.signal.entry_rule_method: [fixed_z]
  setups.multi_pair_beta.pipeline.signal.two_stage_enabled: [false]

experiments:
  # TLS: (5 lookbacks at 1D + 3 lookbacks at 3D) x 3 return intervals
  # x 3 entry thresholds = 72 configs.
  - name: tls_return_intervals_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [tls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [7200, 14400, 28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
  - name: tls_return_intervals_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [tls]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]

  # Huber: same 72 public/return-interval combinations; robust parameters fixed.
  - name: huber_return_intervals_1d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [huber]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [7200, 14400, 28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [1440]
      setups.multi_pair_beta.pipeline.estimator.huber_delta: [1.96]
      setups.multi_pair_beta.pipeline.estimator.huber_iterations: [5]
  - name: huber_return_intervals_3d_update
    active_setup: multi_pair_beta
    params:
      <<: *common_params
      setups.multi_pair_beta.pipeline.estimator.method: [huber]
      setups.multi_pair_beta.pipeline.estimator.model_lookback_bars: [28800, 43200, 86400]
      setups.multi_pair_beta.pipeline.estimator.model_update_interval_bars: [4320]
      setups.multi_pair_beta.pipeline.estimator.huber_delta: [1.96]
      setups.multi_pair_beta.pipeline.estimator.huber_iterations: [5]
