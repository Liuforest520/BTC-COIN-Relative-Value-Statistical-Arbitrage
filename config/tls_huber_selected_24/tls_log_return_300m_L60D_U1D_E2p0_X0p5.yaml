backtest:
  initial_cash: 100000
  start_time: '2025-01-01'
active_setup: multi_pair_beta
setups:
  multi_pair_beta:
    strategy: multi_pair
    pairs:
    - pair_id: arb_op
      x_symbol: ARBUSDT
      y_symbol: OPUSDT
    - pair_id: atom_dot
      x_symbol: ATOMUSDT
      y_symbol: DOTUSDT
    - pair_id: avax_sol
      x_symbol: AVAXUSDT
      y_symbol: SOLUSDT
    - pair_id: apt_sei
      x_symbol: APTUSDT
      y_symbol: SEIUSDT
    - pair_id: fet_rndr
      x_symbol: FETUSDT
      y_symbol: RENDERUSDT
    - pair_id: ar_fil
      x_symbol: ARUSDT
      y_symbol: FILUSDT
    - pair_id: bico_dydx
      x_symbol: BICOUSDT
      y_symbol: DYDXUSDT
    - pair_id: pyth_tnsr
      x_symbol: PYTHUSDT
      y_symbol: TNSRUSDT
    - pair_id: aave_uni
      x_symbol: AAVEUSDT
      y_symbol: UNIUSDT
    - pair_id: hbar_xrp
      x_symbol: HBARUSDT
      y_symbol: XRPUSDT
    - pair_id: btc_mstr
      x_symbol: BTCUSDT
      y_symbol: MSTRUSDT
      tags:
      - tradfi
    - pair_id: samsung_sk
      x_symbol: SAMSUNGUSDT
      y_symbol: SKHYNIXUSDT
      tags:
      - tradfi
    - pair_id: xau_xag
      x_symbol: XAUUSDT
      y_symbol: XAGUSDT
      tags:
      - tradfi
    - pair_id: ewj_ewy
      x_symbol: EWJUSDT
      y_symbol: EWYUSDT
      tags:
      - tradfi
    - pair_id: anthropic_openai
      x_symbol: ANTHROPICUSDT
      y_symbol: OPENAIUSDT
      tags:
      - tradfi
    pipeline:
      estimator:
        method: tls
        regression_method: log_return
        return_interval_bars: 300
        model_lookback_bars: 86400
        model_update_interval_bars: 1440
        position_update_policy: freeze
        residual_adf_max_pvalue: 0.4
        residual_adf_maxlag: 1
        residual_adf_regression: c
        dols_lead_lag_order: 1
        ewls_half_life_bars: 1440
        huber_delta: 1.345
        huber_iterations: 5
        age_wls_profile: medium
        age_bucket_end_bars:
        - 720
        - 4320
        - 11520
        - 28800
        age_bucket_weights: null
        winsor_lower_quantile: 0.005
        winsor_upper_quantile: 0.995
        winsor_quantile_method: linear
        residual_wls_profile: medium
        short_model_lookback_bars: 10080
        shock_score_boundaries:
        - 1.5
        - 2.0
        - 3.0
        shock_weights: null
      signal:
        method: zscore_reversion
        entry_z: 2.0
        exit_z: 0.5
        position_exit_zscore_method: standard
        entry_rule_method: fixed_z
        two_stage_enabled: false
        two_stage_trigger_z: 2.0
        two_stage_entry_z: 1.75
        two_stage_entry_window_z: null
        two_stage_max_wait_bars: 0
        reversion_filter_enabled: true
        reversion_ma_lookback_bars: 60
        reversion_min_samples: 60
      sizing:
        method: beta_neutral
        hedge_beta_lookback_bars: 1440
        hedge_beta_min_samples: 1440
      portfolio:
        method: equal_weight
        allocation_mode: equal_cap
        min_signal_score: 0.0
        max_open_pairs: 10
        max_entries_per_pair: 1
        add_cooldown_bars: 720
        min_hold_bars: 0
      execution:
        pending_timeout_bars: 0
        order_type: market
cost:
  fee_rate: 0.0005
  slippage_bps: 1
  funding_enabled: true
risk:
  enabled: false
  mode: pass_through
  max_leverage: 1.0
  diagnostic_sample_interval_bars: 60
  order_hedge_ratio_tolerance: 0.02
  position_hedge_ratio_tolerance: 0.05
report:
  run_name: tls_log_return_300m_L60D_U1D_E2p0_X0p5
