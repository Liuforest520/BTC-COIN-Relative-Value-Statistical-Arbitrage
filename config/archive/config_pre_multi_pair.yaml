backtest:
  initial_cash: 100000
  start_time: "2026-3-1"
active_setup: multi_pair_legacy
setups:
  multi_pair_legacy:
    strategy: multi_pair
    pairs:
      # Crypto pairs (10)
      - {pair_id: "arb_op", x_symbol: ARBUSDT, y_symbol: OPUSDT}
      - {pair_id: "atom_dot", x_symbol: ATOMUSDT, y_symbol: DOTUSDT}
      - {pair_id: "avax_sol", x_symbol: AVAXUSDT, y_symbol: SOLUSDT}
      - {pair_id: "apt_sei", x_symbol: APTUSDT, y_symbol: SEIUSDT}
      - {pair_id: "fet_rndr", x_symbol: FETUSDT, y_symbol: RENDERUSDT}
      - {pair_id: "ar_fil", x_symbol: ARUSDT, y_symbol: FILUSDT}
      - {pair_id: "bico_dydx", x_symbol: BICOUSDT, y_symbol: DYDXUSDT}
      - {pair_id: "pyth_tnsr", x_symbol: PYTHUSDT, y_symbol: TNSRUSDT}
      - {pair_id: "aave_uni", x_symbol: AAVEUSDT, y_symbol: UNIUSDT}
      - {pair_id: "hbar_xrp", x_symbol: HBARUSDT, y_symbol: XRPUSDT}
      # TradFi pairs (5)
      - {pair_id: "btc_mstr", x_symbol: BTCUSDT, y_symbol: MSTRUSDT, tags: ["tradfi"]}
      - {pair_id: "samsung_sk", x_symbol: SAMSUNGUSDT, y_symbol: SKHYNIXUSDT, tags: ["tradfi"]}
      - {pair_id: "xau_xag", x_symbol: XAUUSDT, y_symbol: XAGUSDT, tags: ["tradfi"]}
      - {pair_id: "ewj_ewy", x_symbol: EWJUSDT, y_symbol: EWYUSDT, tags: ["tradfi"]}
      - {pair_id: "anthropic_openai", x_symbol: ANTHROPICUSDT, y_symbol: OPENAIUSDT, tags: ["tradfi"]}
    pipeline:
      # ===== 旧版 cointegration_reversion_zscore 参数（rolling OLS）=====
      estimator:
        method: rolling_ols
        regression_method: log_price          # log_price 回归
        model_lookback_bars: 28800            # 窗口 28800 bar（20天）
        model_update_interval_bars: 1440      # 每 1440 bar 重估一次
        hedge_model_lookback_bars: 28800      # hedge_model 窗口
        hedge_model_update_interval_bars: 1440
        hedge_regression_method: log_price    # 已统一为 Log Price 回归
        zscore_lookback_bars: 1440
      # ===== 旧版信号参数（等待回归后入场 + two-stage）=====
      signal:
        method: zscore_reversion
        entry_z: 1.75
        exit_z: 0.5
        two_stage_enabled: true
        two_stage_trigger_z: 2.0
        two_stage_min_wait_bars: 1
        reversion_filter_enabled: true
        reversion_ma_lookback_bars: 60
        reversion_min_samples: 60
        reversion_min_ma_gap: 0.0
        extreme_lookback_bars: 0
        min_reversion_from_extreme: 0.0
        slope_lookback_bars: 0
        min_slope: 0.0
      # ===== 旧版 sizing：beta_neutral gross 0.5 + fixed_add 加仓 =====
      sizing:
        method: beta_neutral
        equity: 100000
        gross_exposure_ratio: 0.5
        max_gross_exposure_ratio: 1.0
        max_add_times: 3                       # 最多加 3 次
        add_interval_bars: 720                 # 720 bar 间隔
        add_gross_exposure_ratio: 0.5
        require_add_reversion_vs_last_entry: true
        add_reversion_buffer: 0.0
      portfolio:
        method: equal_weight
        allocation_mode: equal_cap
        max_entries_per_pair: 4        # 首仓 + 最多 3 次加仓（对应旧版 max_add_times 3）
        add_cooldown_bars: 720         # 加仓间隔 720 bar（对应旧版 add_interval_bars 720）
        min_hold_bars: 0
      execution:
        pending_timeout_bars: 5
        order_type: market
cost:
  fee_rate: 0.0005
  slippage_bps: 1
  funding_enabled: true
risk:
  enabled: false
  mode: pass_through
  max_leverage: 1.0
  order_hedge_ratio_tolerance: 0.02
  position_hedge_ratio_tolerance: 0.05
